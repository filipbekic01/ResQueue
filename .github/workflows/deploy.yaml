name: Deploy
on:
  push:
    branches:
      - prod

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-exists: ${{ steps.image.outputs.exists }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      # Single source of truth for the release version: <Version> in ResQueue.csproj
      - name: Read version from ResQueue.csproj
        id: version
        run: echo "version=$(grep -oPm1 '(?<=<Version>)[^<]+' backend/ResQueue/ResQueue/ResQueue.csproj)" >> "$GITHUB_OUTPUT"

      # Re-running a deploy for an already released version must not rebuild and overwrite its image
      - name: Check if the Docker image already exists
        id: image
        run: |
          if docker manifest inspect "ghcr.io/filipbekic01/resqueue:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  DeployNuget:
    needs: Version
    runs-on: ubuntu-latest
    # Shows up under "Deployments" on the repository home page, linking to the published package
    environment:
      name: nuget
      url: https://www.nuget.org/packages/ResQueue.MassTransit/${{ needs.Version.outputs.version }}
    permissions:
      contents: read
      id-token: write # Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet API key
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build:prod

      - name: Build the project
        working-directory: backend/ResQueue/ResQueue
        run: dotnet build --configuration Release

      - name: Pack the NuGet package
        working-directory: backend/ResQueue/ResQueue
        run: dotnet pack --configuration Release

      # Uses the Trusted Publishing policy on nuget.org (repo filipbekic01/ResQueue, deploy.yaml, environment nuget)
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: filipbekic01

      - name: Push the NuGet package
        working-directory: backend/ResQueue/ResQueue
        run: dotnet nuget push bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  DeployImage:
    needs: Version
    if: needs.Version.outputs.image-exists != 'true'
    runs-on: ubuntu-latest
    environment:
      name: docker
      url: https://github.com/filipbekic01/ResQueue/pkgs/container/resqueue
    env:
      ResQueueImageVersion: ${{ needs.Version.outputs.version }}
      DockerRegistry: ghcr.io
      DockerRepository: filipbekic01/resqueue
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build:prod

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish x64 image
        working-directory: backend/ResQueue/ResQueue.Standalone
        run: dotnet publish --os linux -p:TargetFramework=net11.0 --arch x64 /t:PublishContainer -p:ContainerImageTag=${ResQueueImageVersion}-x64 -p:ContainerRepository=${DockerRepository} -p:ContainerRegistry=${DockerRegistry}

      - name: Publish arm64 image
        working-directory: backend/ResQueue/ResQueue.Standalone
        run: dotnet publish --os linux -p:TargetFramework=net11.0 --arch arm64 /t:PublishContainer -p:ContainerImageTag=${ResQueueImageVersion}-arm64 -p:ContainerRepository=${DockerRepository} -p:ContainerRegistry=${DockerRegistry}

      - name: Publish image manifest
        run: |
          set -e
          docker manifest create "${DockerRegistry}/${DockerRepository}:${ResQueueImageVersion}" "${DockerRegistry}/${DockerRepository}:${ResQueueImageVersion}-x64" "${DockerRegistry}/${DockerRepository}:${ResQueueImageVersion}-arm64"
          docker manifest push "${DockerRegistry}/${DockerRepository}:${ResQueueImageVersion}"

          docker manifest create "${DockerRegistry}/${DockerRepository}:latest" "${DockerRegistry}/${DockerRepository}:${ResQueueImageVersion}-x64" "${DockerRegistry}/${DockerRepository}:${ResQueueImageVersion}-arm64"
          docker manifest push "${DockerRegistry}/${DockerRepository}:latest"
